name: mzansi_meds_reminder
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  go_router: ^14.0.0

  # Database — Drift (SQLite ORM)
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  pdf: ^3.10.8
  share_plus: ^10.1.4
  path_provider: ^2.1.3
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.15.2
  cloud_firestore: ^5.4.4

  # Network connectivity monitoring
  connectivity_plus: ^6.0.5

  # PIN hashing
  crypto: ^3.0.3

  # Push notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift code generation
  build_runner: ^2.4.13
  drift_dev: ^2.21.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/LOGO.png
    - assets/images/english.png
    - assets/images/isiZulu.png
    - assets/images/isiXhosa.png
    - assets/images/HOME_TAB.png
    - assets/images/PROGRESS_TAB.png
    - assets/images/MEDICATION_TAB.png
    - assets/images/PROFILE_TAB.png
    - assets/images/MEDICINE.png
    - assets/images/tick.png